name: Restaurant Data Update

on:
  # Trigger manually from the Actions tab only
  workflow_dispatch:

jobs:
  update-data:
    name: Fetch & Commit Restaurant Data
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push the updated CSV back to the repo

    steps:
      # ── 1. Check out the repository ─────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Set up Java (required by PySpark) ────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Set up Python ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # ── 4. Install dependencies ─────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── 5. Run data collection ───────────────────────────────────────────────
      # GOOGLE_API_KEY is stored as a repository secret:
      #   Settings → Secrets and variables → Actions → New repository secret
      - name: Collect restaurant data
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          HISTORICAL_FILE: data/historical_ratings.csv
          OUTPUT_FILE: colombo_restaurants.csv
          PYTHONPATH: ${{ github.workspace }}
        run: python part_a/01_data_collection.py

      # ── 6. Commit & push updated CSV ─────────────────────────────────────────
      # Only commits when the CSV actually changed (idempotent on empty runs).
      - name: Commit updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add colombo_restaurants.csv data/historical_ratings.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "chore: restaurant data update — ${TIMESTAMP}"
            git push
          fi
