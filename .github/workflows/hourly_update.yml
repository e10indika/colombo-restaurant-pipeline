name: Hourly Restaurant Data Update

on:
  # Run at the top of every hour
  #schedule:
  #  - cron: '0 * * * *'

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  update-data:
    name: Fetch & Commit Restaurant Data
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push the updated CSV back to the repo

    steps:
      # ── 1. Check out the repository ─────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so git log / diffs work correctly
          fetch-depth: 0

      # ── 2. Set up Python ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # ── 3. Install dependencies ─────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── 4. Run the pipeline ─────────────────────────────────────────────────
      # GOOGLE_API_KEY is stored as a repository secret:
      #   Settings → Secrets and variables → Actions → New repository secret
      - name: Run data pipeline
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          HISTORICAL_FILE: data/historical_ratings.csv
          OUTPUT_FILE: colombo_restaurants.csv
        run: python pipeline.py

      # ── 5. Commit & push updated CSV ─────────────────────────────────────────
      # Only commits when the CSV actually changed (idempotent on empty runs).
      - name: Commit updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add colombo_restaurants.csv data/historical_ratings.csv

          # Exit cleanly if there is nothing new to commit
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "chore: hourly data update — ${TIMESTAMP}"
            git push
          fi
